<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پیگیر | مدیریت لید و تسک</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css">
<style>
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface-2:#F8F9FC; --border:#E1E5EE;
  --text:#1B2233; --text-muted:#6B7488; --text-faint:#98A1B3;
  --primary:#2E3A6E; --primary-dark:#212A54; --primary-light:#E6E9F5;
  --heevaa:#0E7C7A; --heevaa-bg:#E1F3F1;
  --finno:#9C7A22; --finno-bg:#F6EFDC;
  --dejano:#6C3E78; --dejano-bg:#F1E5F2;
  --general:#4E586B; --general-bg:#E9ECF2;
  --danger:#C13F45; --danger-bg:#FBE8E8;
  --warning:#B9852E; --warning-bg:#FBF0DC;
  --success:#2C8A57; --success-bg:#E2F4E9;
  --radius:10px; --radius-sm:7px;
  --shadow-sm:0 1px 2px rgba(20,26,46,.06);
  --shadow-md:0 4px 16px rgba(20,26,46,.10);
  --shadow-lg:0 12px 40px rgba(20,26,46,.18);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:'Vazirmatn',Tahoma,sans-serif;background:var(--bg);color:var(--text);
  font-size:14.5px;line-height:1.7;-webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
button{cursor:pointer;}
::selection{background:var(--primary-light);}
.hidden{display:none !important;}
a{color:inherit;}

/* ---------- layout ---------- */
#app{display:flex;min-height:100vh;}
.sidebar{
  width:230px;flex:0 0 230px;background:var(--primary-dark);color:#fff;
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
.sidebar .brand{padding:22px 20px 16px;border-bottom:1px solid rgba(255,255,255,.1);}
.sidebar .brand .logo{font-size:19px;font-weight:700;letter-spacing:.2px;}
.sidebar .brand .sub{font-size:12px;color:rgba(255,255,255,.55);margin-top:3px;}
.sidebar nav{flex:1;padding:14px 10px;}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);
  color:rgba(255,255,255,.72);font-size:14px;cursor:pointer;margin-bottom:2px;transition:background .12s;
}
.nav-item svg{flex:0 0 18px;width:18px;height:18px;opacity:.85;}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff;}
.nav-item.active{background:rgba(255,255,255,.13);color:#fff;font-weight:600;}
.nav-item .count{
  margin-inline-start:auto;background:rgba(255,255,255,.14);border-radius:20px;padding:1px 8px;font-size:11.5px;
}
.nav-item.active .count{background:#fff;color:var(--primary-dark);}
.sidebar .foot{padding:14px 18px;font-size:11.5px;color:rgba(255,255,255,.4);border-top:1px solid rgba(255,255,255,.1);}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  position:sticky;top:0;z-index:20;background:rgba(242,244,248,.9);backdrop-filter:blur(6px);
  display:flex;align-items:center;gap:14px;padding:14px 26px;border-bottom:1px solid var(--border);
}
.topbar h1{font-size:19px;margin:0;font-weight:700;}
.topbar .date-pill{
  font-size:12.5px;color:var(--text-muted);background:var(--surface);border:1px solid var(--border);
  padding:5px 12px;border-radius:20px;
}
.topbar .spacer{flex:1;}
.icon-btn{
  width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:var(--surface);
  display:flex;align-items:center;justify-content:center;position:relative;transition:.12s;
}
.icon-btn:hover{border-color:var(--primary);color:var(--primary);}
.icon-btn svg{width:17px;height:17px;}
.badge-dot{
  position:absolute;top:-3px;left:-3px;background:var(--danger);color:#fff;border-radius:50%;
  min-width:16px;height:16px;font-size:10px;display:flex;align-items:center;justify-content:center;padding:0 3px;
  border:2px solid var(--bg);
}
.btn{
  display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--surface);
  padding:9px 16px;border-radius:var(--radius-sm);font-size:13.5px;font-weight:600;transition:.12s;white-space:nowrap;
}
.btn:hover{border-color:var(--primary);color:var(--primary);}
.btn svg{width:15px;height:15px;}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-dark);color:#fff;border-color:var(--primary-dark);}
.btn-danger{color:var(--danger);}
.btn-danger:hover{border-color:var(--danger);color:var(--danger);background:var(--danger-bg);}
.btn-ghost{border-color:transparent;background:transparent;}
.btn-ghost:hover{background:var(--surface-2);border-color:var(--border);color:var(--text);}
.btn-sm{padding:6px 11px;font-size:12.5px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

#view-root{padding:22px 26px 60px;flex:1;}

/* dropdown */
.dropdown{position:relative;}
.dropdown-panel{
  position:absolute;left:0;top:calc(100% + 8px);background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);box-shadow:var(--shadow-md);width:340px;max-height:420px;overflow:auto;z-index:50;
}
.dropdown-panel .dp-head{padding:12px 16px;font-weight:700;font-size:13.5px;border-bottom:1px solid var(--border);}
.dropdown-panel .dp-item{padding:11px 16px;border-bottom:1px solid var(--border);font-size:13px;}
.dropdown-panel .dp-item:last-child{border-bottom:none;}
.dropdown-panel .dp-empty{padding:26px 16px;text-align:center;color:var(--text-faint);font-size:13px;}

/* cards / grid */
.grid{display:grid;gap:14px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:2fr 1fr;}
@media(max-width:1050px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-2{grid-template-columns:1fr;}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;}
.stat-card .num{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;}
.stat-card .lbl{color:var(--text-muted);font-size:12.5px;margin-top:4px;}
.stat-card.accent-heevaa{border-top:3px solid var(--heevaa);}
.stat-card.accent-finno{border-top:3px solid var(--finno);}
.stat-card.accent-dejano{border-top:3px solid var(--dejano);}
.stat-card.accent-general{border-top:3px solid var(--text-faint);}

.section-title{display:flex;align-items:center;gap:10px;margin:26px 0 12px;}
.section-title h2{font-size:15.5px;margin:0;font-weight:700;}
.section-title .sub{color:var(--text-faint);font-size:12.5px;}

/* tags/badges */
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:600;}
.tag-heevaa{background:var(--heevaa-bg);color:var(--heevaa);}
.tag-finno{background:var(--finno-bg);color:var(--finno);}
.tag-dejano{background:var(--dejano-bg);color:var(--dejano);}
.tag-general{background:var(--general-bg);color:var(--general);}
.tag-danger{background:var(--danger-bg);color:var(--danger);}
.tag-warning{background:var(--warning-bg);color:var(--warning);}
.tag-success{background:var(--success-bg);color:var(--success);}
.tag-muted{background:var(--surface-2);color:var(--text-muted);}

/* lists */
.list{display:flex;flex-direction:column;gap:10px;}

.empty-state{
  text-align:center;padding:60px 20px;color:var(--text-muted);border:1.5px dashed var(--border);border-radius:var(--radius);
}
.empty-state .ic{width:44px;height:44px;margin:0 auto 14px;color:var(--text-faint);}
.empty-state h3{margin:0 0 6px;color:var(--text);font-size:15px;}
.empty-state p{margin:0 0 16px;font-size:13px;}

/* filter bar */
.filterbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
.filterbar select,.filterbar input[type=text]{
  padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);min-width:130px;
}
.filterbar input[type=text]{min-width:220px;}
.chip-group{display:flex;gap:6px;flex-wrap:wrap;}
.chip{
  padding:6px 13px;border-radius:20px;border:1px solid var(--border);background:var(--surface);font-size:12.5px;font-weight:600;
}
.chip.active{background:var(--primary);color:#fff;border-color:var(--primary);}

/* forms */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.form-grid.full,.field.full{grid-column:1/-1;}
.field label{display:block;font-size:12.5px;font-weight:700;margin-bottom:6px;color:var(--text-muted);}
.field input[type=text],.field input[type=email],.field input[type=tel],.field input[type=time],
.field select,.field textarea{
  width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface-2);
}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--primary-light);border-color:var(--primary);background:#fff;}
.field textarea{resize:vertical;min-height:70px;}
.date-select-group{display:flex;gap:8px;}
.date-select-group select{flex:1;}
.checkbox-row{display:flex;gap:16px;flex-wrap:wrap;padding-top:4px;}
.checkbox-item{display:flex;align-items:center;gap:6px;font-size:13px;}
.hint{font-size:11.5px;color:var(--text-faint);margin-top:5px;}

/* modal */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(20,24,40,.45);display:flex;align-items:flex-start;justify-content:center;
  padding:40px 16px;z-index:100;overflow:auto;
}
.modal{
  background:var(--surface);border-radius:14px;box-shadow:var(--shadow-lg);width:100%;max-width:640px;
}
.modal.modal-sm{max-width:420px;}
.modal-head{display:flex;align-items:center;padding:18px 22px;border-bottom:1px solid var(--border);}
.modal-head h3{margin:0;font-size:16px;font-weight:700;}
.modal-body{padding:20px 22px;max-height:65vh;overflow:auto;}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid var(--border);}

/* calendar */
.cal-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.cal-head h2{font-size:16px;margin:0 0 0 4px;font-weight:700;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.cal-dow{text-align:center;font-size:12px;color:var(--text-faint);font-weight:700;padding-bottom:4px;}
.cal-dow.fri{color:var(--danger);opacity:.75;}
.cal-cell{
  min-height:96px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);
  padding:7px;display:flex;flex-direction:column;gap:4px;cursor:pointer;transition:.12s;position:relative;
}
.cal-cell:hover{border-color:var(--primary);box-shadow:var(--shadow-sm);}
.cal-cell.other-month{background:var(--surface-2);opacity:.45;cursor:default;}
.cal-cell.today{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary);}
.cal-cell .dnum{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--text);}
.cal-cell .dnum.fri{color:var(--danger);}
.cal-cell .dnum.today-num{
  display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;
  background:var(--primary);color:#fff;border-radius:50%;
}
.cal-chips{display:flex;flex-direction:column;gap:3px;}
.cal-task-chip{
  display:block;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:10.8px;font-weight:600;padding:2px 6px;border-radius:5px;
}
.cal-task-chip.done-chip{opacity:.5;text-decoration:line-through;}
.cal-more{font-size:10px;color:var(--text-faint);padding:0 2px;}
.cal-count-badge{
  position:absolute;top:6px;left:6px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;
  border-radius:50%;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center;padding:0 3px;
}
.cal-cell.today .cal-count-badge{background:var(--primary);}

/* toast */
#toast-wrap{position:fixed;bottom:20px;left:20px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{
  background:var(--primary-dark);color:#fff;padding:11px 18px;border-radius:var(--radius-sm);font-size:13px;
  box-shadow:var(--shadow-md);animation:toastIn .18s ease;
}
.toast.error{background:var(--danger);}
.toast.success{background:var(--success);}
@keyframes toastIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* backup view */
.backup-status{display:flex;align-items:center;gap:10px;padding:14px 16px;border-radius:var(--radius-sm);background:var(--surface-2);border:1px solid var(--border);}
.dot-live{width:9px;height:9px;border-radius:50%;background:var(--text-faint);flex:0 0 9px;}
.dot-live.on{background:var(--success);box-shadow:0 0 0 3px var(--success-bg);}

.lead-detail-head{display:flex;align-items:flex-start;gap:13px;margin-bottom:14px;}
.avatar-circle{
  width:40px;height:40px;border-radius:50%;background:var(--primary-light);color:var(--primary);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex:0 0 40px;
}

/* ---------- compact tables (leads / tasks) ---------- */
.lead-table,.task-table{border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);overflow:hidden;}
.lead-table-head,.lead-row{
  display:grid;grid-template-columns:32px 1.7fr 1.3fr 1fr 1.1fr 60px;gap:10px;align-items:center;
}
.lead-table-head{padding:8px 14px;background:var(--surface-2);font-size:11px;font-weight:700;color:var(--text-muted);border-bottom:1px solid var(--border);}
.lead-row{padding:9px 14px;border-bottom:1px solid var(--border);transition:background .1s;}
.lead-row:last-child{border-bottom:none;}
.lead-row:hover{background:var(--surface-2);}
.avatar-sm{
  width:26px;height:26px;border-radius:50%;background:var(--primary-light);color:var(--primary);flex:0 0 26px;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;
}
.l-name-cell{min-width:0;}
.l-name{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.l-company{font-size:11.5px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.l-prods{display:flex;gap:4px;flex-wrap:wrap;min-width:0;}
.cell-muted{font-size:12px;color:var(--text-muted);}

.task-table-head,.task-row{
  display:grid;grid-template-columns:118px 1fr 72px 96px 60px;gap:10px;align-items:center;
}
.task-table-head{padding:8px 14px;background:var(--surface-2);font-size:11px;font-weight:700;color:var(--text-muted);border-bottom:1px solid var(--border);}
.task-row{padding:8px 14px;border-bottom:1px solid var(--border);transition:background .1s;}
.task-row:last-child{border-bottom:none;}
.task-row:hover{background:var(--surface-2);}
.task-row.done .t-title{text-decoration:line-through;color:var(--text-faint);}
.t-main{min-width:0;cursor:pointer;}
.t-title-line{display:flex;align-items:center;gap:7px;min-width:0;}
.t-title{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;}
.pdot{width:7px;height:7px;border-radius:50%;flex:0 0 7px;}
.t-sub{font-size:11.5px;color:var(--text-muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.t-priority{font-size:12px;color:var(--text-muted);}
.t-date{font-size:12px;font-weight:600;cursor:pointer;line-height:1.4;}
.t-time{font-weight:400;color:var(--text-muted);font-size:11px;}
.t-actions{display:flex;gap:3px;justify-content:flex-end;}
.btn-xs{width:26px;height:26px;}
.btn-xs svg{width:13px;height:13px;}

.task-group-sep{
  display:flex;align-items:center;gap:8px;padding:7px 14px;background:var(--surface-2);
  font-size:11.5px;font-weight:700;color:var(--text-muted);border-bottom:1px solid var(--border);
}
.task-group-sep .dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px;}
.task-group-sep .cnt{background:var(--surface);border:1px solid var(--border);padding:0 8px;border-radius:20px;font-size:10.5px;font-weight:700;color:var(--text);}

.status-select{
  width:100%;border:none;border-radius:20px;padding:4px 8px;font-size:11px;font-weight:700;cursor:pointer;
  appearance:none;-webkit-appearance:none;text-align:center;
}
.status-select.st-pending{background:var(--general-bg);color:var(--general);}
.status-select.st-waiting_on_other{background:var(--warning-bg);color:var(--warning);}
.status-select.st-meeting_needed{background:var(--dejano-bg);color:var(--dejano);}
.status-select.st-done{background:var(--success-bg);color:var(--success);}

.subtask-badge{
  display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--success);
  background:var(--success-bg);border-radius:20px;padding:1px 7px;flex:0 0 auto;
}
.subtask-badge svg{width:10px;height:10px;}
.subtask-list{border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;max-height:220px;overflow-y:auto;}
.subtask-item{
  display:flex;align-items:center;gap:9px;padding:8px 10px;border-bottom:1px solid var(--border);background:var(--surface);
}
.subtask-item:last-child{border-bottom:none;}
.subtask-item.done{background:var(--surface-2);}
.subtask-item.done .subtask-text{text-decoration:line-through;color:var(--text-faint);}
.subtask-check{
  width:19px;height:19px;border-radius:50%;border:2px solid var(--border);flex:0 0 19px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:.12s;
}
.subtask-check svg{width:11px;height:11px;}
.subtask-check.checked{background:var(--success);border-color:var(--success);color:#fff;}
.subtask-check:hover{border-color:var(--success);}
.subtask-text{flex:1;min-width:0;font-size:13px;overflow-wrap:break-word;}
.subtask-date{flex:0 0 auto;font-size:11px;color:var(--text-faint);white-space:nowrap;}
.subtask-item.editing{background:var(--primary-light);}
.subtask-edit-input{
  flex:1;min-width:0;padding:5px 9px;border:1px solid var(--primary);border-radius:6px;font-size:13px;background:#fff;
}

/* global subtasks page table */
.subtask-table{border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);overflow:hidden;}
.subtask-table-head,.subtask-row{display:grid;grid-template-columns:22px 32px 1fr 190px 90px 64px;gap:10px;align-items:center;}
.subtask-table-head{padding:8px 14px;background:var(--surface-2);font-size:11px;font-weight:700;color:var(--text-muted);border-bottom:1px solid var(--border);}
.subtask-row{padding:8px 14px;border-bottom:1px solid var(--border);transition:background .1s;}
.subtask-row:last-child{border-bottom:none;}
.subtask-row:hover{background:var(--surface-2);}
.subtask-row.done .sg-text{text-decoration:line-through;color:var(--text-faint);}
.sg-text{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
.sg-parent{font-size:11.5px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;min-width:0;}
.sg-parent:hover{color:var(--primary);text-decoration:underline;}
.sg-date{font-size:11.5px;color:var(--text-faint);white-space:nowrap;}
.sg-actions{display:flex;gap:3px;justify-content:flex-end;}
.drag-handle{
  cursor:grab;color:var(--text-faint);display:flex;align-items:center;justify-content:center;
  touch-action:none;user-select:none;-webkit-user-select:none;
}
.drag-handle:hover{color:var(--text-muted);}
.drag-handle:active{cursor:grabbing;}
.drag-handle svg{width:14px;height:14px;}
.hint-icon{display:inline-flex;flex:0 0 auto;}
.hint-icon svg{width:13px;height:13px;}
.subtask-row.dragging{
  position:relative;z-index:60;background:var(--surface);opacity:.98;
  box-shadow:0 14px 28px rgba(20,26,46,.20),0 2px 6px rgba(20,26,46,.10);
  border-radius:var(--radius-sm);cursor:grabbing;
}
.sub-drag-indicator{
  position:fixed;height:3px;border-radius:3px;background:var(--primary);z-index:200;
  opacity:0;pointer-events:none;transition:top .1s ease,left .1s ease,width .1s ease,opacity .12s ease;
  box-shadow:0 0 0 3px var(--primary-light);
}

@media(max-width:860px){
  .lead-table-head,.task-table-head,.subtask-table-head{display:none;}
  .lead-row{display:flex;flex-wrap:wrap;gap:6px 10px;padding:11px 14px;}
  .lead-row .l-name-cell{flex:1 1 auto;min-width:120px;}
  .lead-row .l-prods{flex-basis:100%;order:5;}
  .lead-row .cell-muted{font-size:11.5px;}

/* ======================================================================
   JALALI CALENDAR UTILITIES  (public-domain algorithm, jalaali-js style)
   ====================================================================== */
function jdiv(a,b){return ~~(a/b);}
function jmod(a,b){return a-~~(a/b)*b;}
function jalCal(jy){
  var breaks=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
  var bl=breaks.length,gy=jy+621,leapJ=-14,jp=breaks[0],jm,jump,leap,n,i;
  for(i=1;i<bl;i+=1){jm=breaks[i];jump=jm-jp;if(jy<jm)break;leapJ=leapJ+jdiv(jump,33)*8+jdiv(jmod(jump,33),4);jp=jm;}
  n=jy-jp;leapJ=leapJ+jdiv(n,33)*8+jdiv(jmod(n,33)+3,4);
  if(jmod(jump,33)===4 && jump-n===4)leapJ+=1;
  var leapG=jdiv(gy,4)-jdiv((jdiv(gy,100)+1)*3,4)-150;
  var march=20+leapJ-leapG;
  if(jump-n<6)n=n-jump+jdiv(jump,33)*33;
  leap=jmod(jmod(n+1,33)-1,4);if(leap===-1)leap=4;
  return{leap:leap,gy:gy,march:march};
}
function g2d(gy,gm,gd){
  var d=jdiv((gy+jdiv(gm-8,6)+100100)*1461,4)+jdiv(153*jmod(gm+9,12)+2,5)+gd-34840408;
  d=d-jdiv(jdiv(gy+100100+jdiv(gm-8,6),100)*3,4)+752;return d;
}
function j2d(jy,jm,jd){var r=jalCal(jy);return g2d(r.gy,3,r.march)+(jm-1)*31-jdiv(jm,7)*(jm-7)+jd-1;}
function d2g(jdn){
  var j=4*jdn+139361631;j=j+jdiv(jdiv(4*jdn+183187720,146097)*3,4)*4-3908;
  var i=jdiv(jmod(j,1461),4)*5+308;var gd=jdiv(jmod(i,153),5)+1;var gm=jmod(jdiv(i,153),12)+1;
  var gy=jdiv(j,1461)-100100+jdiv(8-gm,6);return{gy:gy,gm:gm,gd:gd};
}
function d2j(jdn){
  var gy=d2g(jdn).gy,jy=gy-621,r=jalCal(jy),jdn1f=g2d(gy,3,r.march),jd,jm,k;
  k=jdn-jdn1f;
  if(k>=0){if(k<=185){jm=1+jdiv(k,31);jd=jmod(k,31)+1;return{jy:jy,jm:jm,jd:jd};}else{k-=186;}}
  else{jy-=1;k+=179;if(r.leap===1)k+=1;}
  jm=7+jdiv(k,30);jd=jmod(k,30)+1;return{jy:jy,jm:jm,jd:jd};
}
function toJalaali(gy,gm,gd){return d2j(g2d(gy,gm,gd));}
function toGregorian(jy,jm,jd){return d2g(j2d(jy,jm,jd));}
function isLeapJalali(jy){var back=d2j(j2d(jy,12,30));return back.jm===12 && back.jd===30;}
function daysInJalaliMonth(jy,jm){if(jm<=6)return 31;if(jm<=11)return 30;return isLeapJalali(jy)?30:29;}

var JMONTHS=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
var JWEEKDAYS=['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'];
var JWEEKDAYS_SHORT=['ش','ی','د','س','چ','پ','ج'];

function pad2(n){return (n<10?'0':'')+n;}
function pd(str){ // to persian digits
  var map={'0':'۰','1':'۱','2':'۲','3':'۳','4':'۴','5':'۵','6':'۶','7':'۷','8':'۸','9':'۹'};
  return String(str).replace(/[0-9]/g,function(d){return map[d];});
}
function isoToday(){var d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function isoFromDate(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function isoToJalali(iso){var p=iso.split('-').map(Number);return toJalaali(p[0],p[1],p[2]);}
function jalaliToIso(jy,jm,jd){var g=toGregorian(jy,jm,jd);return g.gy+'-'+pad2(g.gm)+'-'+pad2(g.gd);}
function fmtJalali(iso){if(!iso)return '—';var j=isoToJalali(iso);return pd(j.jy+'/'+pad2(j.jm)+'/'+pad2(j.jd));}
function fmtJalaliLong(iso){if(!iso)return '—';var j=isoToJalali(iso);var g=iso.split('-').map(Number);
  var dow=new Date(g[0],g[1]-1,g[2]).getDay();var pIdx=(dow+1)%7;
  return JWEEKDAYS[pIdx]+' '+pd(j.jd)+' '+JMONTHS[j.jm-1]+' '+pd(j.jy);}
function todayJalali(){return isoToJalali(isoToday());}
function fmtJalaliEn(iso){if(!iso)return '';var j=isoToJalali(iso);return j.jy+'/'+pad2(j.jm)+'/'+pad2(j.jd);}
function enDigits(s){
  var map={'۰':'0','۱':'1','۲':'2','۳':'3','۴':'4','۵':'5','۶':'6','۷':'7','۸':'8','۹':'9'};
  return String(s==null?'':s).replace(/[۰-۹]/g,function(d){return map[d];});
}
function parseJalaliDateStr(s){
  if(!s)return null;
  var t=enDigits(s).trim();
  var parts=t.split(/[\/\-]/).map(function(x){return parseInt(x,10);});
  if(parts.length!==3||parts.some(isNaN))return null;
  try{return jalaliToIso(parts[0],parts[1],parts[2]);}catch(e){return null;}
}

/* ======================================================================

   file using the File System Access API, or manual JSON export/import)
   ====================================================================== */
var PRODUCTS=[
  {key:'heevaa',name:'هیوا',desc:'مدیریت API'},
  {key:'finno',name:'فینو',desc:'مدیریت درآمد API'},

];

var LEAD_SOURCES=['معرفی','وبسایت','تماس سرد','نمایشگاه/رویداد','شبکه‌های اجتماعی','سایر'];

];

  {v:0,l:'بدون یادآوری'},{v:15,l:'۱۵ دقیقه قبل'},{v:30,l:'۳۰ دقیقه قبل'},{v:60,l:'۱ ساعت قبل'},
  {v:180,l:'۳ ساعت قبل'},{v:1440,l:'۱ روز قبل'},{v:2880,l:'۲ روز قبل'}
];

function uid(){return 'id_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);}

var state={leads:[],tasks:[],settings:{notifEnabled:false,defaultReminder:60},subtaskOrder:[]};

/* ---------------- backup / persistence ---------------- */
var backupHandle=null, backupFileName=null, lastBackupAt=null;
var hasFSA = ('showSaveFilePicker' in window);

async function verifyPermission(handle){
  try{
    if((await handle.queryPermission({mode:'readwrite'}))==='granted')return true;
    if((await handle.requestPermission({mode:'readwrite'}))==='granted')return true;
  }catch(e){}
  return false;
}
async function writeBackupNow(){
  if(!backupHandle)return;
  try{
    var ok=await verifyPermission(backupHandle);
    if(!ok)return;
    var writable=await backupHandle.createWritable();
    await writable.write(JSON.stringify(state,null,2));
    await writable.close();
    lastBackupAt=new Date();
    updateBackupStatusUI();
  }catch(e){console.error('backup write failed',e);}
}
function persist(){ writeBackupNow(); saveSidebarFoot(); }

async function createNewBackupFile(){
  if(!hasFSA){toast('مرورگر شما از بکاپ خودکار پشتیبانی نمی‌کند؛ از دانلود دستی استفاده کنید.','error');return;}
  try{
    var handle=await window.showSaveFilePicker({suggestedName:'peygir-backup.json',types:[{description:'JSON', accept:{'application/json':['.json']}}]});
    backupHandle=handle; backupFileName=handle.name;
    await writeBackupNow();
    toast('فایل بکاپ ایجاد شد. از این پس هر تغییری خودکار در آن ذخیره می‌شود.','success');
    updateBackupStatusUI();
  }catch(e){if(e.name!=='AbortError')toast('ایجاد فایل بکاپ ناموفق بود.','error');}
}
async function openExistingBackupFile(){
  if(!hasFSA){toast('مرورگر شما از این قابلیت پشتیبانی نمی‌کند؛ از «بازیابی دستی» استفاده کنید.','error');return;}
  try{
    var handles=await window.showOpenFilePicker({types:[{description:'JSON', accept:{'application/json':['.json']}}],multiple:false});
    var handle=handles[0];
    var ok=await verifyPermission(handle);
    if(!ok){toast('اجازه دسترسی به فایل داده نشد.','error');return;}
    var file=await handle.getFile();
    var text=await file.text();
    var data=JSON.parse(text);
    if(!data||!Array.isArray(data.leads)||!Array.isArray(data.tasks))throw new Error('invalid');
    state=Object.assign({leads:[],tasks:[],settings:{notifEnabled:false,defaultReminder:60},subtaskOrder:[]},data);
    backupHandle=handle; backupFileName=handle.name;
    renderAll();
    closeModal();
    updateBackupStatusUI();
    toast('اطلاعات بازیابی شد و بکاپ خودکار روی همین فایل فعال شد.','success');
  }catch(e){if(e.name!=='AbortError')toast('فایل بکاپ نامعتبر است.','error');}
}
function exportManualBackup(){
  var blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download='peygir-backup-'+isoToday()+'.json';document.body.appendChild(a);a.click();a.remove();
  URL.revokeObjectURL(url);
  toast('فایل بکاپ دانلود شد.','success');
}
function importManualBackup(input){
  var file=input.files[0]; if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var data=JSON.parse(e.target.result);
      if(!data||!Array.isArray(data.leads)||!Array.isArray(data.tasks))throw 0;
      state=Object.assign({leads:[],tasks:[],settings:{notifEnabled:false,defaultReminder:60},subtaskOrder:[]},data);

}
function updateBackupStatusUI(){
  var el=document.getElementById('backupStatusBox');

}
function saveSidebarFoot(){
  var el=document.getElementById('sidebarFoot');

  else{el.textContent='بکاپ خودکار غیرفعال است';}
}

/* ======================================================================
   EXCEL EXPORT / IMPORT  (SheetJS)
   ====================================================================== */
function xlsxReady(){
  if(typeof XLSX==='undefined'){toast('کتابخانهٔ اکسل هنوز بارگذاری نشده؛ چند لحظه صبر کنید و دوباره تلاش کنید.','error');return false;}
  return true;
}
function exportLeadsExcel(){
  if(!xlsxReady())return;
  if(!state.leads.length){toast('لیدی برای خروجی گرفتن وجود ندارد.','error');return;}
  var rows=state.leads.map(function(l){
    return {
      'نام':l.name||'',
      'شرکت':l.company||'',
      'تلفن':l.phone||'',
      'ایمیل':l.email||'',
      'محصولات':(l.products||[]).map(function(k){var p=PRODUCTS.find(function(x){return x.key===k;});return p?p.name:k;}).join('، '),
      'وضعیت':l.status||'',
      'منبع':l.source||'',
      'یادداشت':l.notes||'',
      'تاریخ ثبت':l.createdAt?fmtJalaliEn(isoFromDate(new Date(l.createdAt))):''
    };
  });
  var ws=XLSX.utils.json_to_sheet(rows);
  ws['!cols']=[{wch:18},{wch:20},{wch:14},{wch:22},{wch:22},{wch:16},{wch:16},{wch:34},{wch:12}];
  var wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'لیدها');
  XLSX.writeFile(wb,'leads-'+isoToday()+'.xlsx');
  toast('فایل اکسل لیدها دانلود شد.','success');
}
function importLeadsExcel(input){
  var file=input.files[0]; if(!file)return;
  if(!xlsxReady()){input.value='';return;}
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});

        }

        var statusObj=TASK_STATUSES.find(function(s){return s.label===statusLabel||s.short===statusLabel;});
        var status=statusObj?statusObj.key:'pending';
        var timeStr=String(r['ساعت']||'').trim();
        var remin=parseInt(enDigits(r['یادآوری (دقیقه قبل)']||''),10);

        addTaskSilent({
          title:title, leadId:leadId, product:product, priority:priority, status:status,
          dueDateISO:dueIso, dueTime:/^\d{1,2}:\d{2}$/.test(timeStr)?timeStr:'',

      });

function importSubtasksExcel(input){

      var rows=XLSX.utils.sheet_to_json(ws,{defval:''});

      });

      toast(msg, added?'success':'error');
    }catch(err){console.error(err);toast('خواندن فایل اکسل ناموفق بود؛ قالب فایل را بررسی کنید.','error');}
  };
  reader.readAsArrayBuffer(file);
  input.value='';
}

function toast(msg,type){
  var wrap=document.getElementById('toast-wrap');
  var t=document.createElement('div');
  t.className='toast'+(type?' '+type:'');
  t.textContent=msg;
  wrap.appendChild(t);
  setTimeout(function(){t.style.opacity='0';t.style.transition='opacity .25s';setTimeout(function(){t.remove();},250);},3200);
}

var BUCKET_META={
  overdue:{label:'عقب‌افتاده',color:'var(--danger)'},
  today:{label:'امروز',color:'var(--warning)'},
  tomorrow:{label:'فردا',color:'var(--heevaa)'},
  week:{label:'این هفته',color:'var(--primary)'},
  later:{label:'آینده‌تر',color:'var(--text-faint)'},
  done:{label:'انجام‌شده',color:'var(--success)'}
};
var BUCKET_ORDER=['overdue','today','tomorrow','week','later','done'];
function taskBucket(t,todayIso,tomorrowIso,weekEndIso){
  if(t.status==='done')return 'done';
  if(t.dueDateISO<todayIso)return 'overdue';
  if(t.dueDateISO===todayIso)return 'today';
  if(t.dueDateISO===tomorrowIso)return 'tomorrow';
  if(t.dueDateISO<=weekEndIso)return 'week';
  return 'later';
}
function taskTableHead(){
  return '<div class="task-table-head"><div>وضعیت</div><div>عنوان</div><div>اولویت</div><div>سررسید</div><div></div></div>';
}
function renderGroupedTasks(list,opts){
  opts=opts||{};
  var today=isoToday();
  var tmw=new Date();tmw.setDate(tmw.getDate()+1);var tomorrowIso=isoFromDate(tmw);
  var wk=new Date();wk.setDate(wk.getDate()+7);var weekEndIso=isoFromDate(wk);
  var buckets={};
  list.forEach(function(t){var b=taskBucket(t,today,tomorrowIso,weekEndIso);(buckets[b]=buckets[b]||[]).push(t);});
  var order=opts.only?opts.only:BUCKET_ORDER;
  var rows='';
  order.forEach(function(key){
    var arr=buckets[key];
    if(!arr||!arr.length)return;
    arr.sort(function(a,b){return a.dueDateISO<b.dueDateISO?-1:(a.dueDateISO>b.dueDateISO?1:0);});
    if(key==='done')arr.reverse();
    var meta=BUCKET_META[key];
    rows+='<div class="task-group-sep"><span class="dot" style="background:'+meta.color+'"></span>'+meta.label+'<span class="cnt">'+pd(arr.length)+'</span></div>';
    rows+=arr.map(renderTaskRow).join('');
  });
  return '<div class="task-table">'+taskTableHead()+rows+'</div>';
}

   CALENDAR VIEW  (Jalali month grid)
   ====================================================================== */
function renderCalendarView(){
  var root=document.getElementById('view-root');
  var jy=calState.jy, jm=calState.jm;
  var firstIso=jalaliToIso(jy,jm,1);
  var firstDow=(new Date(firstIso.split('-')[0],firstIso.split('-')[1]-1,firstIso.split('-')[2]).getDay()+1)%7; // 0=Sat
  var dim=daysInJalaliMonth(jy,jm);
  var todayIso=isoToday();

  var cells=[];
  for(var i=0;i<firstDow;i++)cells.push(null);
  for(var d=1;d<=dim;d++)cells.push(d);
  while(cells.length%7!==0)cells.push(null);

  var tasksByDate={};
  state.tasks.forEach(function(t){(tasksByDate[t.dueDateISO]=tasksByDate[t.dueDateISO]||[]).push(t);});

  var monthTotal=0;
  Object.keys(tasksByDate).forEach(function(iso){var j=isoToJalali(iso);if(j.jy===jy&&j.jm===jm)monthTotal+=tasksByDate[iso].length;});

  root.innerHTML=
    '<div class="cal-head">'+
      '<button class="icon-btn" onclick="calMonthShift(-1)">'+icon('chevL')+'</button>'+
      '<h2>'+JMONTHS[jm-1]+' '+pd(jy)+'</h2>'+
      '<span class="sub" style="color:var(--text-faint);font-size:12.5px">'+(monthTotal?pd(monthTotal)+' تسک این ماه':'')+'</span>'+
      '<button class="btn btn-sm" onclick="calGoToday()">امروز</button>'+
      '<button class="icon-btn" onclick="calMonthShift(1)">'+icon('chevR')+'</button>'+
    '</div>'+
    '<div class="cal-grid">'+
      JWEEKDAYS_SHORT.map(function(w,i){return '<div class="cal-dow'+(i===6?' fri':'')+'">'+w+'</div>';}).join('')+
      cells.map(function(d,idx){
        if(d===null)return '<div class="cal-cell other-month"></div>';
        var iso=jalaliToIso(jy,jm,d);
        var dayTasks=(tasksByDate[iso]||[]).slice().sort(function(a,b){return (a.dueTime||'').localeCompare(b.dueTime||'');});
        var isToday=iso===todayIso;
        var isFri=(idx%7)===6;
        var openCount=dayTasks.filter(function(t){return t.status!=='done';}).length;
        var chips=dayTasks.slice(0,2).map(function(t){
          var cls = (!t.product||t.product==='general') ? 'tag-general' : 'tag-'+t.product;
          return '<div class="cal-task-chip '+cls+(t.status==='done'?' done-chip':'')+'">'+escapeHtml(truncate(t.title,16))+'</div>';
        }).join('');
        return '<div class="cal-cell'+(isToday?' today':'')+'" onclick="openDayModal(\''+iso+'\')">'+
          '<div class="dnum'+(isFri?' fri':'')+(isToday?' today-num':'')+'">'+pd(d)+'</div>'+
          '<div class="cal-chips">'+chips+'</div>'+
          (dayTasks.length>2?'<div class="cal-more">+'+pd(dayTasks.length-2)+' مورد دیگر</div>':'')+
          (openCount>0?'<span class="cal-count-badge">'+pd(openCount)+'</span>':'')+
        '</div>';
      }).join('')+
    '</div>';
}
function calMonthShift(dir){
  calState.jm+=dir;
  if(calState.jm>12){calState.jm=1;calState.jy++;}
  if(calState.jm<1){calState.jm=12;calState.jy--;}
  renderCalendarView();
}
function calGoToday(){var j=todayJalali();calState.jy=j.jy;calState.jm=j.jm;renderCalendarView();}
function openDayModal(iso){
  var dayTasks=state.tasks.filter(function(t){return t.dueDateISO===iso;})
    .sort(function(a,b){return (a.status==='done')-(b.status==='done') || (a.dueTime||'').localeCompare(b.dueTime||'');});
  var root=document.getElementById('modal-root');
  root.innerHTML='<div class="modal-backdrop" onclick="if(event.target===this)closeModal()">'+
    '<div class="modal">'+
      '<div class="modal-head"><h3>'+fmtJalaliLong(iso)+'</h3><button class="icon-btn btn-sm" style="margin-inline-start:auto" onclick="closeModal()">'+icon('x')+'</button></div>'+

/* ======================================================================
   NOTIFICATIONS
   ====================================================================== */
function requestNotifPermission(){
  if(!('Notification' in window)){toast('مرورگر شما اعلان را پشتیبانی نمی‌کند.','error');return;}
  Notification.requestPermission().then(function(p){
    state.settings.notifEnabled=(p==='granted');
    persist();
    if(currentView==='backup')renderBackupView();
    toast(p==='granted'?'اعلان فعال شد.':'اعلان فعال نشد.', p==='granted'?'success':'error');
  });
}
function checkReminders(){
  var now=new Date();
  var changed=false;
  state.tasks.forEach(function(t){
    if(t.status==='done'||t.notified||!t.reminderMinutes)return;
    var timeStr=t.dueTime||'09:00';
    var due=new Date(t.dueDateISO+'T'+timeStr+':00');
    var remTime=new Date(due.getTime()-t.reminderMinutes*60000);
    if(now>=remTime){
      t.notified=true; changed=true;
      if('Notification' in window && Notification.permission==='granted'){
        var lead=t.leadId?leadById(t.leadId):null;
        try{
          new Notification('یادآوری: '+t.title,{
            body:(lead?('لید: '+lead.name+' — '):'')+'سررسید: '+fmtJalali(t.dueDateISO)+(t.dueTime?(' ساعت '+t.dueTime):''),
            tag:t.id
          });
        }catch(e){}
      }
    }
  });
  if(changed){persist();renderBell();}
}

function renderBell(){
  var today=isoToday();
  var due=state.tasks.filter(function(t){return t.status!=='done'&&(taskDueState(t)==='overdue'||taskDueState(t)==='today');})
    .sort(function(a,b){return a.dueDateISO<b.dueDateISO?-1:1;});
  var countEl=document.getElementById('bellCount');
  if(due.length){countEl.textContent=pd(due.length>9?'9+':due.length);countEl.classList.remove('hidden');}
  else countEl.classList.add('hidden');
  var panel=document.getElementById('bellPanel');
  panel.innerHTML='<div class="dp-head">یادآوری‌ها ('+pd(due.length)+')</div>'+
    (due.length? due.slice(0,12).map(function(t){
      var lead=t.leadId?leadById(t.leadId):null;
      var overdue=taskDueState(t)==='overdue';
      return '<div class="dp-item" style="cursor:pointer" onclick="toggleBell();openTaskModal(\''+t.id+'\')">'+
        '<div style="font-weight:700">'+escapeHtml(t.title)+'</div>'+
        '<div class="hint" style="color:'+(overdue?'var(--danger)':'var(--warning)')+'">'+(overdue?'عقب‌افتاده — ':'')+fmtJalali(t.dueDateISO)+(t.dueTime?' — '+pd(t.dueTime):'')+(lead?' · '+escapeHtml(lead.name):'')+'</div>'+
      '</div>';
    }).join('') : '<div class="dp-empty">یادآوری فعالی وجود ندارد</div>');
}
function toggleBell(){
  var p=document.getElementById('bellPanel');
  p.classList.toggle('hidden');
}
document.addEventListener('click',function(e){

  if(dd && !dd.contains(e.target)) document.getElementById('bellPanel').classList.add('hidden');
  var sb=document.getElementById('sidebar'), mb=document.getElementById('menuBtn');

function addLead(data){
  data.id=uid(); data.createdAt=new Date().toISOString();
  state.leads.push(data); persist();
}
function addLeadSilent(data){
  data.id=uid(); data.createdAt=new Date().toISOString();
  state.leads.push(data);
}
function updateLead(id,data){
  var l=leadById(id); if(!l)return; Object.assign(l,data); persist();
}
function deleteLead(id){
  state.leads=state.leads.filter(function(l){return l.id!==id;});
  state.tasks.forEach(function(t){if(t.leadId===id)t.leadId=null;});
  persist();

  else renderAll();
}

  var l=leadById(id);

}

/* ======================================================================
   CRUD — TASKS
   ====================================================================== */
function addTask(data){
  data.id=uid(); data.createdAt=new Date().toISOString(); data.notified=false;
  if(!data.status)data.status='pending';
  state.tasks.push(data); persist();
}
function addTaskSilent(data){
  data.id=uid(); data.createdAt=new Date().toISOString(); data.notified=false;
  if(!data.status)data.status='pending';
  state.tasks.push(data);
}
function updateTask(id,data){
  var t=taskById(id); if(!t)return;
  var dueChanged = data.dueDateISO!==t.dueDateISO || data.dueTime!==t.dueTime;
  Object.assign(t,data);
  if(dueChanged)t.notified=false;
  persist();
}
function deleteTask(id){
  state.tasks=state.tasks.filter(function(t){return t.id!==id;});
  persist(); renderCurrentSoft();
}
function confirmDeleteTask(id){
  var t=taskById(id);
  openConfirm('حذف تسک','آیا از حذف «'+escapeHtml(t?t.title:'')+'» مطمئن هستید؟',function(){deleteTask(id);toast('تسک حذف شد.','success');});
}
function renderCurrentSoft(){
  renderNav();

function yearOptions(selYear){
  var base=todayJalali().jy; var opts='';
  for(var y=base-1;y<=base+3;y++)opts+='<option value="'+y+'"'+(y===selYear?' selected':'')+'>'+pd(y)+'</option>';
  return opts;

function populateDayOptions(selDay){
  var ySel=document.getElementById('fTaskYear'), mSel=document.getElementById('fTaskMonth'), dSel=document.getElementById('fTaskDay');
  if(!ySel||!mSel||!dSel)return;
  var jy=Number(ySel.value), jm=Number(mSel.value);
  var dim=daysInJalaliMonth(jy,jm);
  var current=selDay||Number(dSel.value)||1;
  if(current>dim)current=dim;
  var opts='';
  for(var d=1;d<=dim;d++)opts+='<option value="'+d+'"'+(d===current?' selected':'')+'>'+pd(d)+'</option>';
  dSel.innerHTML=opts;
}
function renderProductOptions(leadId,selected){

  avail.forEach(function(p){opts.push('<option value="'+p.key+'"'+(selected===p.key?' selected':'')+'>'+p.name+'</option>');});
  opts.push('<option value="general"'+(selected==='general'||!selected?' selected':'')+'>عمومی / داخلی</option>');
  return opts.join('');

/* ---------- subtask / progress-log checklist inside the task form ---------- */
var editingSubtaskId=null;
function renderSubtaskListHtml(){
  if(!taskModalSubtasks.length)return '<div class="hint" style="padding:6px 0">هنوز ریزکاری ثبت نشده؛ هر بار کاری روی این تسک انجام دادید، اینجا اضافه کنید.</div>';
  var sorted=taskModalSubtasks.slice().sort(function(a,b){return a.createdAt<b.createdAt?-1:1;});
  return '<div class="subtask-list">'+sorted.map(function(s){
    if(editingSubtaskId===s.id){
      return '<div class="subtask-item editing">'+
        '<div class="subtask-check'+(s.done?' checked':'')+'" onclick="toggleSubtaskDraft(\''+s.id+'\')" title="انجام‌شده/نشده">'+(s.done?icon('check'):'')+'</div>'+
        '<input type="text" class="subtask-edit-input" id="subtaskEditInput_'+s.id+'" value="'+escapeHtml(s.text)+'" onkeydown="handleSubtaskEditKey(event,\''+s.id+'\')">'+
        '<button type="button" class="icon-btn btn-xs" onclick="confirmEditSubtask(\''+s.id+'\')" title="ذخیره">'+icon('check')+'</button>'+
        '<button type="button" class="icon-btn btn-xs" onclick="cancelEditSubtask()" title="انصراف">'+icon('x')+'</button>'+
      '</div>';
    }
    return '<div class="subtask-item'+(s.done?' done':'')+'">'+
      '<div class="subtask-check'+(s.done?' checked':'')+'" onclick="toggleSubtaskDraft(\''+s.id+'\')" title="انجام‌شده/نشده">'+(s.done?icon('check'):'')+'</div>'+
      '<div class="subtask-text">'+escapeHtml(s.text)+'</div>'+
      '<div class="subtask-date">'+fmtJalali(isoFromDate(new Date(s.createdAt)))+'</div>'+
      '<button type="button" class="icon-btn btn-xs" onclick="startEditSubtask(\''+s.id+'\')" title="ویرایش">'+icon('edit')+'</button>'+
      '<button type="button" class="icon-btn btn-xs" onclick="deleteSubtaskDraft(\''+s.id+'\')" title="حذف">'+icon('trash')+'</button>'+
    '</div>';
  }).join('')+'</div>';
}
function refreshSubtaskUI(){
  var c=document.getElementById('subtaskListContainer');
  if(c)c.innerHTML=renderSubtaskListHtml();
  var lbl=document.getElementById('subtaskCountLabel');
  if(lbl){
    var done=taskModalSubtasks.filter(function(s){return s.done;}).length;
    lbl.textContent=taskModalSubtasks.length?('('+pd(done)+'/'+pd(taskModalSubtasks.length)+' انجام‌شده)'):'';
  }
  if(editingSubtaskId){
    var ei=document.getElementById('subtaskEditInput_'+editingSubtaskId);
    if(ei){ei.focus();ei.setSelectionRange(ei.value.length,ei.value.length);}
  }
}
function addSubtaskDraft(){
  var input=document.getElementById('subtaskInput');
  if(!input)return;
  var val=input.value.trim();
  if(!val)return;
  taskModalSubtasks.push({id:uid(),text:val,done:false,createdAt:new Date().toISOString()});
  input.value='';
  refreshSubtaskUI();
  input.focus();
}
function toggleSubtaskDraft(id){
  var s=taskModalSubtasks.find(function(x){return x.id===id;});
  if(s){s.done=!s.done;refreshSubtaskUI();}
}
function deleteSubtaskDraft(id){
  taskModalSubtasks=taskModalSubtasks.filter(function(x){return x.id!==id;});
  if(editingSubtaskId===id)editingSubtaskId=null;
  refreshSubtaskUI();
}
function startEditSubtask(id){
  editingSubtaskId=id;
  refreshSubtaskUI();
}
function confirmEditSubtask(id){
  var input=document.getElementById('subtaskEditInput_'+id);
  if(!input)return;
  var val=input.value.trim();
  if(!val){toast('متن ریزکار نمی‌تواند خالی باشد.','error');return;}
  var s=taskModalSubtasks.find(function(x){return x.id===id;});
  if(s)s.text=val;
  editingSubtaskId=null;
  refreshSubtaskUI();
}
function cancelEditSubtask(){
  editingSubtaskId=null;
  refreshSubtaskUI();
}
function handleSubtaskEditKey(e,id){
  if(e.key==='Enter'){e.preventDefault();confirmEditSubtask(id);}
  else if(e.key==='Escape'){e.preventDefault();cancelEditSubtask();}
}
function handleSubtaskInputKey(e){
  if(e.key==='Enter'){e.preventDefault();addSubtaskDraft();}
}
function subtaskProgress(t){
  if(!t.subtasks||!t.subtasks.length)return null;
  var done=t.subtasks.filter(function(s){return s.done;}).length;
  return {done:done,total:t.subtasks.length};
}
function getAllSubtasksFlat(){
  var out=[];
  state.tasks.forEach(function(t){
    (t.subtasks||[]).forEach(function(s){out.push({task:t,sub:s});});
  });
  return out;
}

function ensureSubtaskOrderConsistent(){
  if(!Array.isArray(state.subtaskOrder))state.subtaskOrder=[];
  var flat=getAllSubtasksFlat();
  var allIds=flat.map(function(x){return x.sub.id;});
  state.subtaskOrder=state.subtaskOrder.filter(function(id){return allIds.indexOf(id)>-1;});
  var missing=allIds.filter(function(id){return state.subtaskOrder.indexOf(id)===-1;});
  if(missing.length){
    missing.sort(function(a,b){
      var A=flat.find(function(x){return x.sub.id===a;}).sub.createdAt;
      var B=flat.find(function(x){return x.sub.id===b;}).sub.createdAt;
      return A<B?1:-1;
    });
    state.subtaskOrder=state.subtaskOrder.concat(missing);
  }
}
function moveSubtaskInOrder(draggedId,targetId,position){
  ensureSubtaskOrderConsistent();
  var order=state.subtaskOrder;
  var fromIdx=order.indexOf(draggedId);
  if(fromIdx>-1)order.splice(fromIdx,1);
  var toIdx=order.indexOf(targetId);
  if(toIdx===-1){order.push(draggedId);}
  else{
    if(position==='after')toIdx+=1;
    order.splice(toIdx,0,draggedId);
  }
  persist();
  animateSubtaskReorder();
}
// Records each row's current on-screen position, re-renders the list, then
// smoothly animates every row from its old position to its new one
// (a lightweight FLIP animation) instead of an abrupt jump.
function animateSubtaskReorder(){
  var container=document.querySelector('.subtask-table');
  var firstRects={};
  if(container){
    Array.prototype.slice.call(container.querySelectorAll('.subtask-row')).forEach(function(r){
      var id=r.getAttribute('data-sub-id');
      if(id)firstRects[id]=r.getBoundingClientRect().top;
    });
  }
  renderSubtasksView();
  var newContainer=document.querySelector('.subtask-table');
  if(!newContainer)return;
  Array.prototype.slice.call(newContainer.querySelectorAll('.subtask-row')).forEach(function(r){
    var id=r.getAttribute('data-sub-id');
    if(!id || !(id in firstRects))return;
    var dy=firstRects[id]-r.getBoundingClientRect().top;
    if(Math.abs(dy)<1)return;
    r.style.transition='none';
    r.style.transform='translateY('+dy+'px)';
    requestAnimationFrame(function(){
      r.style.transition='transform .22s cubic-bezier(.2,.8,.3,1)';
      r.style.transform='';
    });
  });
}

var subtaskDragState=null; // {id, rowEl, startClientY, overId, overPos}
function ensureDragIndicator(){
  var ind=document.getElementById('subDragIndicator');
  if(!ind){
    ind=document.createElement('div');
    ind.id='subDragIndicator';
    ind.className='sub-drag-indicator';
    document.body.appendChild(ind);
  }
  return ind;
}
function positionDragIndicator(rect,visible){
  var ind=ensureDragIndicator();
  if(!visible){ind.style.opacity='0';return;}
  ind.style.top=rect.top+'px';
  ind.style.left=rect.left+'px';
  ind.style.width=rect.width+'px';
  ind.style.opacity='1';
}
function startSubtaskDrag(e,id){
  e.preventDefault();
  var row=e.target.closest('.subtask-row');
  if(!row)return;
  subtaskDragState={id:id,rowEl:row,startClientY:e.clientY,overId:null,overPos:null};
  row.classList.add('dragging');
  row.style.transition='none';
  ensureDragIndicator();
  try{e.target.setPointerCapture(e.pointerId);}catch(err){}
  document.addEventListener('pointermove',onSubtaskDragMove);
  document.addEventListener('pointerup',onSubtaskDragEnd);
  document.addEventListener('pointercancel',onSubtaskDragEnd);
}
function onSubtaskDragMove(e){
  if(!subtaskDragState)return;
  var dy=e.clientY-subtaskDragState.startClientY;
  subtaskDragState.rowEl.style.transform='translateY('+dy+'px)';

  var container=document.querySelector('.subtask-table');
  if(!container)return;
  var rows=Array.prototype.slice.call(container.querySelectorAll('.subtask-row'));
  var y=e.clientY;
  var bestRow=null,bestPos=null,bestDist=Infinity;
  rows.forEach(function(r){
    if(r===subtaskDragState.rowEl)return;
    var rect=r.getBoundingClientRect();
    var mid=rect.top+rect.height/2;
    var dist=Math.abs(y-mid);
    if(dist<bestDist){bestDist=dist;bestRow=r;bestPos=(y<mid)?'before':'after';}
  });
  if(bestRow){
    var r=bestRow.getBoundingClientRect();
    var lineTop = bestPos==='before' ? r.top-1.5 : r.bottom-1.5;
    positionDragIndicator({top:lineTop,left:r.left,width:r.width},true);
    subtaskDragState.overId=bestRow.getAttribute('data-sub-id');
    subtaskDragState.overPos=bestPos;
  }else{
    positionDragIndicator(null,false);
    subtaskDragState.overId=null;
    subtaskDragState.overPos=null;
  }
}
function onSubtaskDragEnd(e){
  if(!subtaskDragState)return;
  var st=subtaskDragState;
  document.removeEventListener('pointermove',onSubtaskDragMove);
  document.removeEventListener('pointerup',onSubtaskDragEnd);
  document.removeEventListener('pointercancel',onSubtaskDragEnd);
  st.rowEl.style.transition='';
  st.rowEl.style.transform='';
  st.rowEl.classList.remove('dragging');
  positionDragIndicator(null,false);
  subtaskDragState=null;
  if(st.overId && st.overId!==st.id){
    moveSubtaskInOrder(st.id,st.overId,st.overPos);
  }
}

/* ======================================================================
   GLOBAL SUBTASKS PAGE  (all sub-tasks across every task, in one place)
   ====================================================================== */
function subtaskTableHead(){
  return '<div class="subtask-table-head"><div></div><div></div><div>متن</div><div>مربوط به تسک</div><div>تاریخ</div><div></div></div>';
}
function renderGlobalSubtaskRow(item){
  var t=item.task, s=item.sub;
  var lead=t.leadId?leadById(t.leadId):null;
  if(editingGlobalSubtask===s.id){
    return '<div class="subtask-row editing" data-sub-id="'+s.id+'">'+
      '<div class="drag-handle" style="visibility:hidden">'+icon('grip')+'</div>'+
      '<div class="subtask-check'+(s.done?' checked':'')+'" onclick="toggleGlobalSubtask(\''+t.id+'\',\''+s.id+'\')" title="انجام‌شده/نشده">'+(s.done?icon('check'):'')+'</div>'+
      '<input type="text" class="subtask-edit-input" id="gSubtaskEditInput_'+s.id+'" value="'+escapeHtml(s.text)+'" onkeydown="handleGlobalSubtaskEditKey(event,\''+t.id+'\',\''+s.id+'\')">'+
      '<div class="sg-parent">'+escapeHtml(t.title)+'</div>'+
      '<div class="sg-date">'+fmtJalali(isoFromDate(new Date(s.createdAt)))+'</div>'+
      '<div class="sg-actions">'+
        '<button type="button" class="icon-btn btn-xs" onclick="confirmGlobalSubtaskEdit(\''+t.id+'\',\''+s.id+'\')" title="ذخیره">'+icon('check')+'</button>'+
        '<button type="button" class="icon-btn btn-xs" onclick="cancelGlobalSubtaskEdit()" title="انصراف">'+icon('x')+'</button>'+
      '</div>'+
    '</div>';
  }
  return '<div class="subtask-row'+(s.done?' done':'')+'" data-sub-id="'+s.id+'">'+
    '<div class="drag-handle" title="برای تغییر ترتیب بکشید" onpointerdown="startSubtaskDrag(event,\''+s.id+'\')">'+icon('grip')+'</div>'+
    '<div class="subtask-check'+(s.done?' checked':'')+'" onclick="toggleGlobalSubtask(\''+t.id+'\',\''+s.id+'\')" title="انجام‌شده/نشده">'+(s.done?icon('check'):'')+'</div>'+
    '<div class="sg-text">'+escapeHtml(s.text)+'</div>'+
    '<div class="sg-parent" onclick="openTaskModal(\''+t.id+'\')" title="باز کردن تسک">'+escapeHtml(t.title)+(lead?' · '+escapeHtml(lead.name):'')+'</div>'+
    '<div class="sg-date">'+fmtJalali(isoFromDate(new Date(s.createdAt)))+'</div>'+
    '<div class="sg-actions">'+
      '<button type="button" class="icon-btn btn-xs" onclick="startGlobalSubtaskEdit(\''+s.id+'\')" title="ویرایش">'+icon('edit')+'</button>'+
      '<button type="button" class="icon-btn btn-xs" onclick="confirmDeleteGlobalSubtask(\''+t.id+'\',\''+s.id+'\')" title="حذف">'+icon('trash')+'</button>'+
    '</div>'+
  '</div>';
}
function renderSubtasksView(){
  var root=document.getElementById('view-root');
  ensureSubtaskOrderConsistent();
  var orderIndex={};
  state.subtaskOrder.forEach(function(id,i){orderIndex[id]=i;});
  var all=getAllSubtasksFlat();
  var list=all.filter(function(item){
    if(subtasksFilter.status==='open' && item.sub.done)return false;
    if(subtasksFilter.status==='done' && !item.sub.done)return false;
    if(subtasksFilter.q){
      var q=subtasksFilter.q.toLowerCase();
      if((item.sub.text+' '+item.task.title).toLowerCase().indexOf(q)===-1)return false;
    }
    return true;
  }).sort(function(a,b){
    var ai=orderIndex.hasOwnProperty(a.sub.id)?orderIndex[a.sub.id]:Infinity;
    var bi=orderIndex.hasOwnProperty(b.sub.id)?orderIndex[b.sub.id]:Infinity;
    return ai-bi;
  });

  var totalAll=all.length;
  var doneAll=all.filter(function(x){return x.sub.done;}).length;

  root.innerHTML=
    '<div class="filterbar">'+
      '<input type="text" id="subtasksSearchBox" placeholder="جست‌وجو در متن ریزکارها یا عنوان تسک..." value="'+escapeHtml(subtasksFilter.q)+'" oninput="handleSubtasksSearchInput(this)">'+
      '<select onchange="subtasksFilter.status=this.value;renderSubtasksView();">'+
        '<option value="all"'+(subtasksFilter.status==='all'?' selected':'')+'>همه</option>'+
        '<option value="open"'+(subtasksFilter.status==='open'?' selected':'')+'>انجام‌نشده</option>'+
        '<option value="done"'+(subtasksFilter.status==='done'?' selected':'')+'>انجام‌شده</option>'+
      '</select>'+
      '<div style="flex:1"></div>'+
      '<span class="hint">'+(totalAll?pd(doneAll)+' از '+pd(totalAll)+' انجام‌شده':'')+'</span>'+
      '<button class="btn btn-sm" onclick="exportSubtasksExcel()" title="دانلود اکسل">'+icon('download')+'اکسل</button>'+
      '<button class="btn btn-sm" onclick="document.getElementById(\'subtasksExcelInput\').click()" title="آپلود اکسل">'+icon('upload')+'اکسل</button>'+
      '<input type="file" id="subtasksExcelInput" accept=".xlsx,.xls" class="hidden" onchange="importSubtasksExcel(this)">'+
    '</div>'+
    (totalAll?'<div class="hint" style="margin-bottom:10px;display:flex;align-items:center;gap:6px"><span class="hint-icon">'+icon('grip')+'</span>با دستگیرهٔ کنار هر ردیف، آن را بکشید تا ترتیب اولویت را خودتان مشخص کنید — بالاترین ردیف مهم‌ترین است.</div>':'')+
    (list.length?'<div class="subtask-table">'+subtaskTableHead()+list.map(renderGlobalSubtaskRow).join('')+'</div>'
      : totalAll
        ? '<div class="empty-state">'+wrapIcon('search')+'<h3>موردی یافت نشد</h3><p>فیلتر یا جست‌وجو را تغییر دهید.</p></div>'
        : '<div class="empty-state">'+wrapIcon('checklist')+'<h3>هنوز ریزکاری ثبت نشده</h3><p>از داخل هر تسک می‌توانید ریزکار اضافه کنید؛ همهٔ آن‌ها این‌جا هم نمایش داده می‌شوند.</p></div>');
}
function handleSubtasksSearchInput(el){
  var pos=el.selectionStart;
  subtasksFilter.q=el.value;
  renderSubtasksView();
  var ni=document.getElementById('subtasksSearchBox');
  if(ni){ni.focus();try{ni.setSelectionRange(pos,pos);}catch(e){}}
}
function toggleGlobalSubtask(taskId,subId){
  var t=taskById(taskId); if(!t)return;
  var s=(t.subtasks||[]).find(function(x){return x.id===subId;});
  if(!s)return;
  s.done=!s.done;
  persist(); renderCurrentSoft();
}
function startGlobalSubtaskEdit(subId){
  editingGlobalSubtask=subId;
  renderCurrentSoft();
  var el=document.getElementById('gSubtaskEditInput_'+subId);
  if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length);}
}
function confirmGlobalSubtaskEdit(taskId,subId){
  var input=document.getElementById('gSubtaskEditInput_'+subId);
  if(!input)return;
  var val=input.value.trim();
  if(!val){toast('متن ریزکار نمی‌تواند خالی باشد.','error');return;}
  var t=taskById(taskId); if(!t)return;
  var s=(t.subtasks||[]).find(function(x){return x.id===subId;});
  if(s)s.text=val;
  editingGlobalSubtask=null;
  persist(); renderCurrentSoft();
}
function cancelGlobalSubtaskEdit(){
  editingGlobalSubtask=null;
  renderCurrentSoft();
}
function handleGlobalSubtaskEditKey(e,taskId,subId){
  if(e.key==='Enter'){e.preventDefault();confirmGlobalSubtaskEdit(taskId,subId);}
  else if(e.key==='Escape'){e.preventDefault();cancelGlobalSubtaskEdit();}
}
function deleteGlobalSubtask(taskId,subId){
  var t=taskById(taskId); if(!t)return;
  t.subtasks=(t.subtasks||[]).filter(function(x){return x.id!==subId;});
  persist(); renderCurrentSoft();
}
function confirmDeleteGlobalSubtask(taskId,subId){
  openConfirm('حذف ریزکار','این مورد برای همیشه حذف می‌شود. ادامه می‌دهید؟',function(){deleteGlobalSubtask(taskId,subId);toast('ریزکار حذف شد.','success');});
}

function submitTaskForm(id){
  var title=document.getElementById('fTaskTitle').value.trim();
  if(!title){toast('عنوان تسک الزامی است.','error');return;}
  var jy=Number(document.getElementById('fTaskYear').value);
  var jm=Number(document.getElementById('fTaskMonth').value);
  var jd=Number(document.getElementById('fTaskDay').value);
  var data={
    title:title,
    leadId:document.getElementById('fTaskLead').value||null,
    product:document.getElementById('fTaskProduct').value,
    priority:document.getElementById('fTaskPriority').value,
    status:document.getElementById('fTaskStatus').value,
    dueDateISO:jalaliToIso(jy,jm,jd),
    dueTime:document.getElementById('fTaskTime').value||'',
    reminderMinutes:Number(document.getElementById('fTaskReminder').value),
    description:document.getElementById('fTaskDesc').value.trim(),
    subtasks:taskModalSubtasks.slice()
  };
  if(id){updateTask(id,data);toast('تسک به‌روزرسانی شد.','success');}
  else{addTask(data);toast('تسک اضافه شد.','success');}
  closeModal(); renderCurrentSoft(); renderBell();
}

  document.getElementById('todayPill').textContent=fmtJalaliLong(isoToday());
}

  renderNav();
  updateTodayPill();
  navigate('dashboard');
  renderBell();
  saveSidebarFoot();
  setInterval(updateTodayPill,60000);
  setInterval(renderBell,60000);

  checkReminders();
  maybeShowBackupPrompt();
}
function maybeShowBackupPrompt(){
  if(!hasFSA)return;
  if(backupHandle)return;
  var root=document.getElementById('modal-root');
  root.innerHTML='<div class="modal-backdrop" onclick="if(event.target===this)dismissBackupPrompt()">'+
    '<div class="modal modal-sm">'+
      '<div class="modal-head"><h3>اتصال به فایل بکاپ</h3></div>'+
      '<div class="modal-body">'+
        '<p style="margin:0 0 4px;font-size:13.5px;color:var(--text-muted);line-height:1.8">'+
          'به دلیل تنظیمات امنیتی مرورگرها، هیچ صفحه‌ای — حتی همین برنامه — نمی‌تواند بدون یک کلیک از طرف شما به فایل روی سیستم‌تان دسترسی نوشتن پیدا کند؛ این محدودیت مرورگر است، نه محدودیت برنامه. برای همین هر بار که این فایل را باز می‌کنید، کافی‌ست یک‌بار فایل بکاپ قبلی را انتخاب کنید تا اطلاعات بازیابی شود و ذخیرهٔ خودکار روی همان فایل ادامه پیدا کند.'+

      '</div>'+

}

    e.preventDefault(); e.returnValue='';
  }
});
